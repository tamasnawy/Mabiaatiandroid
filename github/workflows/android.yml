name: Build Mabiaati APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Extract Android project
    run: |
      unzip -o MabiaatiAndroid.zip -d extracted
      find extracted -name settings.gradle -o -name settings.gradle.kts

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build APK
    run: |
      cd extracted/MabiaatiAndroid
      chmod +x gradlew || true
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Mabiaati-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
